spring:
  application:
    name: ledgerflow

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ledgerflow}
    username: ${DB_USER:ledgerflow}
    password: ${DB_PASSWORD:ledgerflow}
    hikari:
      pool-name: ledgerflow-pool
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  mvc:
    problemdetails:
      enabled: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: true

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, modulith
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    root: INFO
    am.ankap.ledgerflow: DEBUG

ledgerflow:
  verification:
    interval: 10s
  psp:
    base-url: ${PSP_BASE_URL:http://localhost:9090}
    connect-timeout: 1s
    read-timeout: 2s
    max-attempts: 3
    initial-backoff: 200ms
    max-backoff: 2s
  outbox:
    poll-interval: 1s