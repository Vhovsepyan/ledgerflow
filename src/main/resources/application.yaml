spring:
  application:
    name: ledgerflow

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ledgerflow}
    username: ${DB_USER:ledgerflow}
    password: ${DB_PASSWORD:ledgerflow}
    hikari:
      pool-name: ledgerflow-pool
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  mvc:
    problemdetails:
      enabled: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: true

  lifecycle:
    timeout-per-shutdown-phase: 30s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 5000
        request.timeout.ms: 2000
    consumer:
      group-id: webhook-dispatcher
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, modulith
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    root: INFO
    am.ankap.ledgerflow: DEBUG

ledgerflow:
  verification:
    interval: 10s
  psp:
    base-url: ${PSP_BASE_URL:http://localhost:9090}
    connect-timeout: 1s
    read-timeout: 2s
    max-attempts: 3
    initial-backoff: 200ms
    max-backoff: 2s
  outbox:
    poll-interval: 1s
  kafka:
    enabled: true
    payment-events-topic: payment-events
  webhook:
    poll-interval: 2s
  recon:
    cron: "0 0 2 * * *"