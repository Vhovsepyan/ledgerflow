plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'am.ankap'
version = '0.0.1-SNAPSHOT'
description = 'Payment orchestration service with a double-entry ledger'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    springModulithVersion = '2.1.0'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    runtimeOnly 'org.springframework.modulith:spring-modulith-actuator'
    runtimeOnly 'org.springframework.modulith:spring-modulith-observability'

    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'

    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'manual'
    }
    testLogging {
        events = ['failed']
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
    }
}

// Slow, narrative tests that drive a real provider over HTTP. Kept out of `test`.
tasks.register('manualTest', Test) {
    group = 'verification'
    description = 'Runs the tests tagged "manual" against the mock PSP.'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'manual'
    }
    testLogging {
        events = ['passed', 'failed', 'skipped']
        showStandardStreams = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
    }
}

// A provider you can poke by hand: ./gradlew mockPsp [-Pport=9090]
tasks.register('mockPsp', JavaExec) {
    group = 'application'
    description = 'Runs the mock PSP standalone so the app can be pointed at it.'

    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'am.ankap.ledgerflow.psp.MockPsp'
    args = [(findProperty('port') ?: '9090').toString()]
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:all', '-Xlint:-serial', '-parameters']
}